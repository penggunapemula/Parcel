<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1f8a4c" />
    <title>Struk Pesanan - Parcelku</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Dancing+Script:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/kartu.css" />
    <link rel="stylesheet" href="css/struk.css" />
  </head>

  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- Bilah alat (tidak ikut tercetak) -->
    <header class="toolbar">
      <a class="btn ghost mini" href="pesanan.html" id="back">← Kembali</a>
      <div class="seg" id="size" role="group" aria-label="Ukuran struk">
        <button type="button" class="on" data-size="wide">Lebar</button>
        <button type="button" data-size="thermal">Struk kecil 80mm</button>
      </div>
      <div class="tools">
        <button type="button" class="btn ghost mini" id="share">💬 Bagikan</button>
        <button type="button" class="btn mini" id="print">🖨️ Cetak / PDF</button>
      </div>
    </header>

    <main class="stage">
      <div id="paper" class="paper"><p class="muted" style="text-align: center">Memuat struk…</p></div>
    </main>

    <div id="toast" role="status"></div>

    <script src="js/core.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/kartu.js"></script>
    <script src="js/struk.js"></script>
  </body>
</html>
