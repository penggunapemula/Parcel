<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1f8a4c" />
    <title>Halaman tidak ditemukan - Parcelku</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <style>
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }

      .code {
        font: 800 clamp(5rem, 22vw, 9rem) var(--font-head);
        line-height: 1;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .box {
        max-width: 420px;
      }

      .box p {
        margin: 10px 0 24px;
        color: var(--mut);
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <main>
      <div class="box">
        <div class="code">404</div>
        <h1>Halaman tidak ditemukan</h1>
        <p>Alamat yang kamu buka tidak ada atau sudah dipindah. Yuk kembali dan susun parcelmu.</p>
        <a class="btn big" href="/beranda.html">🎁 Kembali ke beranda</a>
      </div>
    </main>
  </body>
</html>
