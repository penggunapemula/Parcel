<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1f8a4c" />
    <title>Lacak Pesanan - Parcelku</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/lacak.css" />
  </head>

  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="progress" id="prog"></div>

    <nav class="navbar" id="navbar" aria-label="Navigasi utama">
      <a class="logo" href="beranda.html"
        ><span class="mark">🎁</span><span class="brand-name">Parcelku</span></a
      >
      <ul class="nav-links" id="menu"></ul>
    </nav>
    <nav class="tabbar" id="tabbar" aria-label="Menu utama"></nav>

    <main class="wrap narrow">
      <h1>Lacak pesanan</h1>
      <p class="muted">Tanpa perlu masuk. Cukup kode pesanan dan 4 digit terakhir nomor telepon pemesan.</p>

      <form class="card" id="fLacak">
        <div class="row2">
          <div>
            <label for="kode">Kode pesanan</label>
            <input
              id="kode"
              required
              placeholder="Contoh: PK0012"
              autocapitalize="characters"
              maxlength="12"
            />
          </div>
          <div>
            <label for="hp4">4 digit akhir no. telepon</label>
            <input
              id="hp4"
              required
              inputmode="numeric"
              pattern="[0-9]{4}"
              maxlength="4"
              placeholder="1234"
            />
          </div>
        </div>
        <p class="err" id="eLacak"></p>
        <button class="btn big full">🔎 Lacak sekarang</button>
      </form>

      <section id="hasil" class="card hasil" hidden></section>
    </main>

    <div id="toast" role="status"></div>

    <script src="js/core.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/lacak.js"></script>
  </body>
</html>
